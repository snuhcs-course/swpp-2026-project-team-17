<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Click evaluation time by case and trial</title>
  <desc id="desc">Line chart of recorded selection time in seconds for ten cases across three trials. Timeout points are shown at approximately fifteen seconds.</desc>
  <rect width="900" height="520" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#172554">Click evaluation time by case</text>
  <text x="450" y="58" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#475569">Recorded elapsed time (seconds); timeout cases are marked with ×</text>

  <!-- Plot region: x=80..840, y=90..410; scale 0..16 seconds -->
  <g stroke="#dbe3ef" stroke-width="1">
    <line x1="80" y1="410" x2="840" y2="410"/><line x1="80" y1="330" x2="840" y2="330"/>
    <line x1="80" y1="250" x2="840" y2="250"/><line x1="80" y1="170" x2="840" y2="170"/>
    <line x1="80" y1="90" x2="840" y2="90"/>
  </g>
  <g stroke="#334155" stroke-width="1.5"><line x1="80" y1="90" x2="80" y2="410"/><line x1="80" y1="410" x2="840" y2="410"/></g>
  <g font-family="Arial, sans-serif" font-size="12" fill="#334155" text-anchor="end">
    <text x="68" y="414">0</text><text x="68" y="334">4</text><text x="68" y="254">8</text><text x="68" y="174">12</text><text x="68" y="94">16</text>
  </g>
  <g font-family="Arial, sans-serif" font-size="12" fill="#334155" text-anchor="middle">
    <text x="80" y="432">1</text><text x="164.4" y="432">2</text><text x="248.9" y="432">3</text><text x="333.3" y="432">4</text><text x="417.8" y="432">5</text>
    <text x="502.2" y="432">6</text><text x="586.7" y="432">7</text><text x="671.1" y="432">8</text><text x="755.6" y="432">9</text><text x="840" y="432">10</text>
  </g>
  <text x="460" y="462" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#172554">Case number</text>
  <text x="20" y="250" text-anchor="middle" transform="rotate(-90 20 250)" font-family="Arial, sans-serif" font-size="14" fill="#172554">Seconds</text>

  <!-- Trial 1 -->
  <polyline fill="none" stroke="#2563eb" stroke-width="3" points="80,240 164.4,350.6 248.9,356.8 333.3,318.2 417.8,279.2 502.2,363.6 586.7,143.2 671.1,109.6 755.6,319.6 840,151.4"/>
  <g fill="#2563eb"><circle cx="80" cy="240" r="4"/><circle cx="164.4" cy="350.6" r="4"/><circle cx="248.9" cy="356.8" r="4"/><circle cx="333.3" cy="318.2" r="4"/><circle cx="417.8" cy="279.2" r="4"/><circle cx="502.2" cy="363.6" r="4"/><circle cx="586.7" cy="143.2" r="4"/><circle cx="755.6" cy="319.6" r="4"/><circle cx="840" cy="151.4" r="4"/></g>
  <path d="M671.1 102 L678 109.6 L671.1 117.2 L664.2 109.6 Z" fill="#fff" stroke="#2563eb" stroke-width="3"/>

  <!-- Trial 2 -->
  <polyline fill="none" stroke="#16a34a" stroke-width="3" points="80,329.4 164.4,316.6 248.9,300.6 333.3,321 417.8,327.4 502.2,330.2 586.7,208.6 671.1,109.6 755.6,237.2 840,236.2"/>
  <g fill="#16a34a"><circle cx="80" cy="329.4" r="4"/><circle cx="164.4" cy="316.6" r="4"/><circle cx="248.9" cy="300.6" r="4"/><circle cx="333.3" cy="321" r="4"/><circle cx="417.8" cy="327.4" r="4"/><circle cx="502.2" cy="330.2" r="4"/><circle cx="586.7" cy="208.6" r="4"/><circle cx="755.6" cy="237.2" r="4"/><circle cx="840" cy="236.2" r="4"/></g>
  <path d="M671.1 102 L678 109.6 L671.1 117.2 L664.2 109.6 Z" fill="#fff" stroke="#16a34a" stroke-width="3"/>

  <!-- Trial 3 -->
  <polyline fill="none" stroke="#9333ea" stroke-width="3" points="80,276.6 164.4,130.8 248.9,184.2 333.3,318.8 417.8,356 502.2,354.8 586.7,173.4 671.1,109 755.6,304.2 840,255.8"/>
  <g fill="#9333ea"><circle cx="80" cy="276.6" r="4"/><circle cx="164.4" cy="130.8" r="4"/><circle cx="248.9" cy="184.2" r="4"/><circle cx="333.3" cy="318.8" r="4"/><circle cx="417.8" cy="356" r="4"/><circle cx="502.2" cy="354.8" r="4"/><circle cx="586.7" cy="173.4" r="4"/><circle cx="755.6" cy="304.2" r="4"/><circle cx="840" cy="255.8" r="4"/></g>
  <path d="M671.1 101.4 L678 109 L671.1 116.6 L664.2 109 Z" fill="#fff" stroke="#9333ea" stroke-width="3"/>

  <!-- Legend -->
  <g font-family="Arial, sans-serif" font-size="13" fill="#172554">
    <line x1="280" y1="492" x2="310" y2="492" stroke="#2563eb" stroke-width="3"/><circle cx="295" cy="492" r="4" fill="#2563eb"/><text x="318" y="497">Trial 1</text>
    <line x1="405" y1="492" x2="435" y2="492" stroke="#16a34a" stroke-width="3"/><circle cx="420" cy="492" r="4" fill="#16a34a"/><text x="443" y="497">Trial 2</text>
    <line x1="530" y1="492" x2="560" y2="492" stroke="#9333ea" stroke-width="3"/><circle cx="545" cy="492" r="4" fill="#9333ea"/><text x="568" y="497">Trial 3</text>
    <path d="M650 484 L658 492 L650 500 L642 492 Z" fill="#fff" stroke="#334155" stroke-width="2"/><text x="666" y="497">Timeout</text>
  </g>
</svg>
